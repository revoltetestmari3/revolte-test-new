revolte:
  version: '1'
  project: temp
  appName: temp
  env:
    preview:
      services:
        rid_1:
          name: temp
          type: WEB_APP
          entryPoint: src/main.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /
            port: 8080
            loadBalancerMode: shared
    qa:
      branch: qa
      services:
        rid_1:
          name: temp
          type: WEB_APP
          entryPoint: src/main.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /
            port: 8080
            loadBalancerMode: shared
    staging:
      branch: staging
      services:
        rid_1:
          name: temp
          type: WEB_APP
          entryPoint: src/main.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /
            port: 8080
            loadBalancerMode: shared
    production:
      branch: main
      services:
        rid_1:
          name: temp
          type: WEB_APP
          entryPoint: src/main.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 50
            autoScaling:
              replica:
                min: 1
                max: 3
          properties:
            health: /
            port: 8080
            loadBalancerMode: shared
